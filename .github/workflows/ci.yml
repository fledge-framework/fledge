name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger from the Actions tab. Useful for re-running against a
  # branch after a flaky failure, or for kicking off CI without pushing
  # a new commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting is OS-independent; run once on Linux to save CI minutes.
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Melos
        uses: bluefireteam/melos-action@v3
        with:
          melos-version: '7.3.0'

      - name: Check formatting
        run: melos exec -- dart format --set-exit-if-changed .

  analyze:
    name: Analyze (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Melos
        uses: bluefireteam/melos-action@v3
        with:
          melos-version: '7.3.0'

      - name: Generate code
        run: melos run build_runner

      - name: Analyze
        run: melos run analyze

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Melos
        uses: bluefireteam/melos-action@v3
        with:
          melos-version: '7.3.0'

      # Flutter desktop tests on Linux require GTK + build tooling.
      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config libblkid-dev liblzma-dev

      # Some tests (e.g. fledge_ecs_generator's golden-fixture tests)
      # depend on .g.dart files that are not checked in. Generate them
      # before running tests, matching the analyze job.
      - name: Generate code
        run: melos run build_runner

      - name: Run tests
        run: melos run test

  # Pana measures pub.dev package scores.
  #
  # Only runs on tag pushes (releases) or manual dispatch — NOT on
  # regular main pushes or PRs. Reasoning: pana runs `dart pub get` in
  # an isolated sandbox with no workspace, so during a coordinated
  # multi-package release it can't resolve cross-Fledge deps at the
  # new version until they're actually on pub.dev. Running pana before
  # the release lands guarantees red job cards on every commit that
  # includes a version bump. Deferring to tag push means pana runs
  # after `publish-packages.yml` has uploaded the new versions, so
  # constraints resolve cleanly.
  #
  # `continue-on-error: true` kept as belt-and-suspenders — if pana
  # transiently fails on the tag-push run (pub.dev propagation lag,
  # score-threshold quirks), the workflow still succeeds.
  pana:
    name: Pana Analysis
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        package:
          - fledge_assets
          - fledge_audio
          - fledge_ecs
          - fledge_ecs_annotations
          - fledge_ecs_generator
          - fledge_input
          - fledge_physics
          - fledge_render_2d
          - fledge_camera_2d
          - fledge_lighting_2d
          - fledge_ui
          - fledge_debug
          - fledge_save
          - fledge_tiled
          - fledge_calendar
          - fledge_tween
          - fledge_particles
          - fledge_window
          - fledge_yarn
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Melos
        uses: bluefireteam/melos-action@v3
        with:
          melos-version: '7.3.0'

      - name: Install Pana
        run: dart pub global activate pana

      - name: Run Pana on ${{ matrix.package }}
        # `dart pub global run pana` (not just `pana`) so we don't depend
        # on `~/.pub-cache/bin` being on PATH — which caused exit 127
        # after pana printed its score in earlier runs.
        run: |
          cd packages/${{ matrix.package }}
          dart pub global run pana --no-warning --exit-code-threshold 0

  build-examples:
    name: Build Examples (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            drifter-target: linux
          - os: windows-latest
            drifter-target: windows
          - os: macos-latest
            drifter-target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Melos
        uses: bluefireteam/melos-action@v3
        with:
          melos-version: '7.3.0'

      # Flutter Linux desktop target needs GTK + build tooling.
      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config libblkid-dev liblzma-dev

      - name: Generate code for basic_ecs example
        working-directory: examples/basic_ecs
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build basic_ecs example
        working-directory: examples/basic_ecs
        run: dart compile exe bin/main.dart -o basic_ecs

      - name: Build advanced_ecs example
        working-directory: examples/advanced_ecs
        run: dart compile exe bin/main.dart -o advanced_ecs

      # Drifter builds against the desktop target for this runner.
      # Web builds are covered by build-docs (which imports drifter as a lib).
      - name: Enable Flutter ${{ matrix.drifter-target }} desktop
        run: flutter config --enable-${{ matrix.drifter-target }}-desktop

      - name: Build drifter example (${{ matrix.drifter-target }})
        working-directory: examples/drifter
        run: flutter build ${{ matrix.drifter-target }} --release

  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Melos
        uses: bluefireteam/melos-action@v3
        with:
          melos-version: '7.3.0'

      - name: Build docs
        working-directory: docs
        run: flutter build web
