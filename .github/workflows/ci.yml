name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger from the Actions tab. Useful for re-running against a
  # branch after a flaky failure, or for kicking off CI without pushing
  # a new commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting is OS-independent; run once on Linux to save CI minutes.
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Melos
        uses: bluefireteam/melos-action@v3
        with:
          melos-version: '7.3.0'

      - name: Check formatting
        run: melos exec -- dart format --set-exit-if-changed .

  analyze:
    name: Analyze (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Melos
        uses: bluefireteam/melos-action@v3
        with:
          melos-version: '7.3.0'

      - name: Generate code
        run: melos run build_runner

      - name: Analyze
        run: melos run analyze

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Melos
        uses: bluefireteam/melos-action@v3
        with:
          melos-version: '7.3.0'

      # Flutter desktop tests on Linux require GTK + build tooling.
      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config libblkid-dev liblzma-dev

      # Some tests (e.g. fledge_ecs_generator's golden-fixture tests)
      # depend on .g.dart files that are not checked in. Generate them
      # before running tests, matching the analyze job.
      - name: Generate code
        run: melos run build_runner

      - name: Run tests
        run: melos run test

  # Pana measures pub.dev package scores.
  #
  # Only runs on tag pushes (releases) or manual dispatch — NOT on
  # regular main pushes or PRs. Reasoning: pana runs `dart pub get` in
  # an isolated sandbox with no workspace, so during a coordinated
  # multi-package release it can't resolve cross-Fledge deps at the
  # new version until they're actually on pub.dev. Running pana before
  # the release lands guarantees red job cards on every commit that
  # includes a version bump. Deferring to tag push means pana runs
  # after `publish-packages.yml` has uploaded the new versions, so
  # constraints resolve cleanly.
  #
  # `continue-on-error: true` kept as belt-and-suspenders — if pana
  # transiently fails on the tag-push run (pub.dev propagation lag,
  # score-threshold quirks), the workflow still succeeds.
  pana:
    name: Pana Analysis
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        package:
          - fledge_assets
          - fledge_audio
          - fledge_ecs
          - fledge_ecs_annotations
          - fledge_ecs_generator
          - fledge_input
          - fledge_physics
          - fledge_render_2d
          - fledge_camera_2d
          - fledge_lighting_2d
          - fledge_ui
          - fledge_debug
          - fledge_save
          - fledge_tiled
          - fledge_calendar
          - fledge_tween
          - fledge_particles
          - fledge_window
          - fledge_yarn
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Melos
        uses: bluefireteam/melos-action@v3
        with:
          melos-version: '7.3.0'

      - name: Install Pana
        run: dart pub global activate pana

      - name: Run Pana on ${{ matrix.package }}
        # `dart pub global run pana` (not just `pana`) so we don't depend
        # on `~/.pub-cache/bin` being on PATH — which caused exit 127
        # after pana printed its score in earlier runs.
        run: |
          cd packages/${{ matrix.package }}
          dart pub global run pana --no-warning --exit-code-threshold 0

  build-examples:
    name: Build Examples (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            drifter-target: linux
          - os: windows-latest
            drifter-target: windows
          - os: macos-latest
            drifter-target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Melos
        uses: bluefireteam/melos-action@v3
        with:
          melos-version: '7.3.0'

      # Flutter Linux desktop target needs GTK + build tooling.
      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config libblkid-dev liblzma-dev

      - name: Generate code for basic_ecs example
        working-directory: examples/basic_ecs
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build basic_ecs example
        working-directory: examples/basic_ecs
        run: dart compile exe bin/main.dart -o basic_ecs

      - name: Build advanced_ecs example
        working-directory: examples/advanced_ecs
        run: dart compile exe bin/main.dart -o advanced_ecs

      # Drifter builds against the desktop target for this runner.
      # Web builds are covered by build-docs (which imports drifter as a lib).
      - name: Enable Flutter ${{ matrix.drifter-target }} desktop
        run: flutter config --enable-${{ matrix.drifter-target }}-desktop

      - name: Build drifter example (${{ matrix.drifter-target }})
        working-directory: examples/drifter
        run: flutter build ${{ matrix.drifter-target }} --release

  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Melos
        uses: bluefireteam/melos-action@v3
        with:
          melos-version: '7.3.0'

      - name: Build docs
        working-directory: docs
        run: flutter build web

  # ----------------------------------------------------------------
  # Terminal jobs — only run for pushes to main, gated on the full CI
  # matrix passing. Each is a no-op unless its release / docs
  # precondition matches the head commit.
  # ----------------------------------------------------------------

  # Cut the `vX.Y.Z` tag once CI is green on a `chore(release): vX.Y.Z`
  # commit landing on main. The tag push is what triggers
  # `publish-packages.yml` — pub.dev's OIDC publisher config only
  # accepts publishes whose OIDC claim carries `tag` as the ref type,
  # so no other trigger can drive publishing.
  #
  # `dispatch-publish` below is a belt-and-suspenders: pushing a tag
  # with the workflow's built-in GITHUB_TOKEN does NOT automatically
  # start a downstream workflow (GitHub Actions blocks that to prevent
  # recursion). We explicitly dispatch `publish-packages.yml` against
  # the freshly-created tag ref, which preserves the tag OIDC claim.
  tag-release:
    name: Tag Release
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'chore(release): v')
    needs: [format, analyze, test, build-examples, build-docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the tag
      actions: write    # dispatch publish-packages against the tag ref
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse version from release commit
        id: version
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          RESOLVED=$(printf '%s\n' "$SUBJECT" | sed -nE 's/^chore\(release\): v([0-9]+\.[0-9]+\.[0-9]+)( .*)?$/\1/p')
          if [ -z "$RESOLVED" ]; then
            echo "Head commit subject '$SUBJECT' did not match" \
                 "'chore(release): v<X.Y.Z>'. Refusing to tag."
            exit 1
          fi
          echo "VERSION=$RESOLVED" >> $GITHUB_OUTPUT
          echo "TAG=v$RESOLVED" >> $GITHUB_OUTPUT

      - name: Refuse to overwrite existing tag
        run: |
          TAG=${{ steps.version.outputs.TAG }}
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists locally; refusing to re-tag."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "$TAG" > /dev/null 2>&1; then
            echo "Tag $TAG already exists on origin; refusing to re-tag."
            exit 1
          fi

      - name: Create and push tag
        run: |
          TAG=${{ steps.version.outputs.TAG }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Dispatch publish-packages against the new tag ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ steps.version.outputs.TAG }}
          VERSION=${{ steps.version.outputs.VERSION }}
          gh workflow run publish-packages.yml \
            --ref "$TAG" \
            -f "version=$VERSION"

  # Rebuild + redeploy the docs site when the push modifies anything
  # under `docs/`, but only after the CI matrix has confirmed the tree
  # is healthy. Release commits usually don't touch docs; the path
  # check keeps this from firing on every release.
  deploy-docs:
    name: Deploy Docs
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs: [format, analyze, test, build-docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          # `github.event.before` is the commit main pointed at before
          # this push. Fetch enough history so `git diff before..after`
          # resolves for both fast-forward pushes and rare force pushes.

      - name: Check whether docs/ changed
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          # Force pushes or the very first push to a branch can leave
          # BEFORE as the all-zero SHA. In that case, treat every path
          # as changed so we don't miss a legitimate deploy.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "First push or force-push; treating docs as changed."
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if ! git cat-file -e "$BEFORE" 2>/dev/null; then
            git fetch --no-tags --depth=50 origin "$BEFORE" || true
          fi
          if git diff --quiet "$BEFORE" "$AFTER" -- docs/; then
            echo "No changes under docs/; skipping deploy."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Flutter
        if: steps.changes.outputs.changed == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        if: steps.changes.outputs.changed == 'true'
        run: dart pub global activate melos

      - name: Bootstrap dependencies
        if: steps.changes.outputs.changed == 'true'
        run: melos bootstrap

      - name: Build web
        if: steps.changes.outputs.changed == 'true'
        working-directory: docs
        run: flutter build web --release

      - name: Deploy to Firebase
        if: steps.changes.outputs.changed == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          entryPoint: docs
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
