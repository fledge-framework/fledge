name: Deploy Docs

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Manual trigger — redeploy the docs site without cutting a new tag.
  # This covers the "update docs between releases" case without the
  # subtle GitHub Actions behavior where combining branches+tags+paths
  # filters can accidentally filter out legitimate tag pushes.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap dependencies
        run: melos bootstrap

      - name: Build web
        working-directory: docs
        run: flutter build web --release

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          entryPoint: docs
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
