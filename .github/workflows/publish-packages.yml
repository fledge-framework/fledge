name: Publish Packages

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Manual trigger — re-run the publish flow for a specific version
  # without pushing another tag. Combined with the step-level
  # idempotency guards (skip-if-already-published, skip-if-CHANGELOG-
  # entry-already-present), this makes the release process fully
  # replayable from the Actions UI.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.0). Without the leading v.'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC token authentication with pub.dev
      contents: write  # Required for creating GitHub releases and pushing commits

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for changelog generation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          # On tag push: strip the leading `v` from GITHUB_REF_NAME.
          # On manual dispatch: use the input verbatim.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RESOLVED="${{ inputs.version }}"
            echo "Manual trigger — using input version: $RESOLVED"
          else
            RESOLVED="${GITHUB_REF_NAME#v}"
            echo "Tag trigger — extracted version from tag: $RESOLVED"
          fi
          echo "VERSION=$RESOLVED" >> $GITHUB_OUTPUT

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Update package versions
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          echo "Setting all packages to version $VERSION"

          for pubspec in packages/fledge_*/pubspec.yaml; do
            sed -i "s/^version: .*/version: $VERSION/" "$pubspec"
            echo "Updated: $pubspec"
          done

          # Show updated versions
          grep -r "^version:" packages/fledge_*/pubspec.yaml

      - name: Install git-cliff
        run: |
          curl -sSfL https://github.com/orhun/git-cliff/releases/download/v2.7.0/git-cliff-2.7.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv git-cliff-2.7.0/git-cliff /usr/local/bin/
          git-cliff --version

      - name: Generate root changelog
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          DATE=$(date +%Y-%m-%d)

          # Generate the release-body content for this tag.
          # We always regenerate CHANGES.md because the GitHub Release
          # step below needs it fresh even on re-runs.
          git-cliff --config cliff.toml --latest --strip header > CHANGES.md

          # Store for the GitHub release step.
          {
            echo 'content<<EOF'
            cat CHANGES.md
            echo 'EOF'
          } >> $GITHUB_OUTPUT

          # Idempotency guard: if CHANGELOG.md already has a [VERSION]
          # entry (from a previous workflow run for this same tag), do
          # not prepend a duplicate block. This keeps re-runs of the
          # release workflow clean.
          if grep -q "^## \[$VERSION\]" CHANGELOG.md 2>/dev/null; then
            echo "Root CHANGELOG.md already has [$VERSION]; skipping prepend."
            rm CHANGES.md
          else
            # First run for this version: prepend a fresh entry.
            echo "## [$VERSION] - $DATE" > CHANGELOG_NEW.md
            echo "" >> CHANGELOG_NEW.md
            cat CHANGES.md >> CHANGELOG_NEW.md
            echo "" >> CHANGELOG_NEW.md

            if [ -f CHANGELOG.md ]; then
              # Skip the header if it exists
              tail -n +3 CHANGELOG.md >> CHANGELOG_NEW.md 2>/dev/null || true
            fi

            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            cat CHANGELOG_NEW.md >> CHANGELOG.md
            rm CHANGELOG_NEW.md CHANGES.md
          fi

      - name: Generate per-package changelogs
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          DATE=$(date +%Y-%m-%d)

          # Alphabetical — order doesn't matter for changelog generation.
          PACKAGES=(
            "fledge_assets"
            "fledge_audio"
            "fledge_calendar"
            "fledge_camera_2d"
            "fledge_debug"
            "fledge_ecs"
            "fledge_ecs_annotations"
            "fledge_ecs_generator"
            "fledge_input"
            "fledge_lighting_2d"
            "fledge_net"
            "fledge_particles"
            "fledge_physics"
            "fledge_render"
            "fledge_render_2d"
            "fledge_save"
            "fledge_tiled"
            "fledge_time"
            "fledge_tween"
            "fledge_ui"
            "fledge_window"
            "fledge_yarn"
          )

          for pkg in "${PACKAGES[@]}"; do
            echo "Generating changelog for $pkg..."
            PKG_DIR="packages/$pkg"

            # Idempotency guard: if this package's CHANGELOG already has
            # a [$VERSION] entry, skip. Lets the workflow re-run cleanly
            # against the same tag without producing duplicate blocks.
            if grep -q "^## \[$VERSION\]" "$PKG_DIR/CHANGELOG.md" 2>/dev/null; then
              echo "  $pkg CHANGELOG already has [$VERSION]; skipping."
              continue
            fi

            # Generate changelog for commits affecting this package
            # Uses --include-path to filter commits by path
            git-cliff --config cliff.toml --latest --strip header \
              --include-path "$PKG_DIR/**" > "$PKG_DIR/CHANGES.md" 2>/dev/null || true

            # Check if there are any changes for this package
            if [ -s "$PKG_DIR/CHANGES.md" ]; then
              echo "  Found changes for $pkg"

              # Create new changelog entry
              echo "## [$VERSION] - $DATE" > "$PKG_DIR/CHANGELOG_NEW.md"
              echo "" >> "$PKG_DIR/CHANGELOG_NEW.md"
              cat "$PKG_DIR/CHANGES.md" >> "$PKG_DIR/CHANGELOG_NEW.md"
              echo "" >> "$PKG_DIR/CHANGELOG_NEW.md"

              # Prepend to existing changelog or create new one
              if [ -f "$PKG_DIR/CHANGELOG.md" ]; then
                # Skip the header if it exists
                tail -n +3 "$PKG_DIR/CHANGELOG.md" >> "$PKG_DIR/CHANGELOG_NEW.md" 2>/dev/null || true
              fi

              # Add header
              echo "# Changelog" > "$PKG_DIR/CHANGELOG.md"
              echo "" >> "$PKG_DIR/CHANGELOG.md"
              cat "$PKG_DIR/CHANGELOG_NEW.md" >> "$PKG_DIR/CHANGELOG.md"
              rm "$PKG_DIR/CHANGELOG_NEW.md" "$PKG_DIR/CHANGES.md"
            else
              echo "  No specific changes for $pkg, adding version entry"
              # Create minimal changelog entry for version bump
              echo "## [$VERSION] - $DATE" > "$PKG_DIR/CHANGELOG_NEW.md"
              echo "" >> "$PKG_DIR/CHANGELOG_NEW.md"
              echo "- Version bump for framework release" >> "$PKG_DIR/CHANGELOG_NEW.md"
              echo "" >> "$PKG_DIR/CHANGELOG_NEW.md"

              # Prepend to existing changelog
              if [ -f "$PKG_DIR/CHANGELOG.md" ]; then
                tail -n +3 "$PKG_DIR/CHANGELOG.md" >> "$PKG_DIR/CHANGELOG_NEW.md" 2>/dev/null || true
              fi

              echo "# Changelog" > "$PKG_DIR/CHANGELOG.md"
              echo "" >> "$PKG_DIR/CHANGELOG.md"
              cat "$PKG_DIR/CHANGELOG_NEW.md" >> "$PKG_DIR/CHANGELOG.md"
              rm "$PKG_DIR/CHANGELOG_NEW.md"
              rm -f "$PKG_DIR/CHANGES.md"
            fi
          done

      - name: Commit version updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add packages/fledge_*/pubspec.yaml
          git add packages/fledge_*/CHANGELOG.md
          git add CHANGELOG.md

          VERSION=${{ steps.version.outputs.VERSION }}
          git commit -m "chore(release): v$VERSION [skip ci]" || echo "No changes to commit"

          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.content }}
          # On tag push, github.ref_name is the tag (`v0.2.0`).
          # On manual dispatch, it's the branch — synthesize the tag
          # name from the input version instead.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

      - name: Publish packages
        run: |
          # Publish in dependency order. Each package must be already on
          # pub.dev before any package that depends on it publishes,
          # because pub validates hosted deps resolve at their declared
          # constraint.
          #
          # This step is idempotent: for each package we query
          # pub.dev to see whether the current version is already
          # uploaded, and skip when it is. That means the workflow can
          # be re-run against the same tag without needing a version
          # bump — the first run publishes what's new, later runs
          # short-circuit into a green success.
          #
          # Shims (fledge_render, fledge_time) publish last because they
          # depend on the merged/renamed packages.
          PACKAGES=(
            # Foundation: no in-tree deps.
            "fledge_ecs_annotations"
            # Core: depends on annotations.
            "fledge_ecs"
            "fledge_ecs_generator"
            # Assets: depends on ecs.
            "fledge_assets"
            # Render (2D infra + components merged in v0.2).
            "fledge_render_2d"
            # Render extensions: depend on ecs + render_2d (+ assets).
            "fledge_camera_2d"
            "fledge_tween"
            "fledge_particles"
            "fledge_lighting_2d"
            # Platform / peripherals.
            "fledge_input"
            "fledge_audio"
            "fledge_window"
            # Physics (no longer depends on tiled after v0.2).
            "fledge_physics"
            # UI + calendar + yarn + save + net.
            "fledge_ui"
            "fledge_calendar"
            "fledge_yarn"
            "fledge_save"
            "fledge_net"
            # Tiled depends on physics + assets + camera_2d.
            "fledge_tiled"
            # Debug depends on ui + physics + camera_2d + render_2d.
            "fledge_debug"
            # Shims publish last — they depend on the new packages above.
            "fledge_render"
            "fledge_time"
          )

          VERSION=${{ steps.version.outputs.VERSION }}
          FAILED=()

          # Sequential publishes race pub.dev's CDN propagation: a
          # package can fail to publish because a just-published
          # dependency isn't visible to the resolver yet. Retry with
          # backoff to cover that case without blindly sleeping.
          publish_with_retry() {
            local pkg="$1"
            local attempt
            local delays=(0 20 40)  # attempt 1 immediate; then 20s; then 40s
            for attempt in 1 2 3; do
              local delay="${delays[$((attempt - 1))]}"
              if [ "$delay" -gt 0 ]; then
                echo "    retry $attempt after ${delay}s (propagation wait)..."
                sleep "$delay"
              fi
              if (cd "packages/$pkg" && dart pub publish --force); then
                echo "  ✓ Published $pkg $VERSION on attempt $attempt."
                return 0
              fi
            done
            echo "  ✗ Publish of $pkg failed after 3 attempts."
            return 1
          }

          for pkg in "${PACKAGES[@]}"; do
            echo ""
            echo "=== $pkg $VERSION ==="

            # Ask pub.dev whether this exact version is already
            # published. 200 = yes, skip. 404 = no (either the whole
            # package doesn't exist yet, or just this version — either
            # way, we should attempt to publish).
            HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
              "https://pub.dev/api/packages/$pkg/versions/$VERSION" || echo "000")

            case "$HTTP_STATUS" in
              200)
                echo "  ✓ $pkg $VERSION already on pub.dev, skipping."
                ;;
              404)
                echo "  → $pkg $VERSION not on pub.dev, publishing..."
                publish_with_retry "$pkg" || FAILED+=("$pkg")
                ;;
              *)
                echo "  ! Unexpected HTTP $HTTP_STATUS from pub.dev for $pkg $VERSION."
                echo "  ! Attempting publish anyway; if it succeeds, treat as first-time."
                publish_with_retry "$pkg" || FAILED+=("$pkg")
                ;;
            esac
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo ""
            echo "The following packages failed to publish:"
            printf '  - %s\n' "${FAILED[@]}"
            exit 1
          fi

          echo ""
          echo "All packages either already published or successfully published."
