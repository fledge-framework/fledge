name: Publish Packages

on:
  # Automatic trigger: a `vX.Y.Z` tag is pushed. pub.dev's OIDC
  # publisher config only accepts publishes whose OIDC claim carries
  # `tag` as the ref type (see https://dart.dev/go/publishing-from-github),
  # so `dart pub publish` in this workflow will only succeed when the
  # workflow itself is triggered by a tag push. The `tag-release` job
  # in `ci.yml` pushes this tag after CI succeeds on a release commit.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Manual trigger — replayable from the Actions UI against an existing
  # tag ref (select the tag in the "Use workflow from" dropdown). The
  # OIDC ref-type constraint still applies, so branch-ref dispatches
  # will fail at the publish step; select the tag, not `main`.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.0). Without the leading v.'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC token authentication with pub.dev
      contents: write  # Required for creating GitHub releases and pushing commits

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for changelog generation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          # On tag push: strip the leading `v` from GITHUB_REF_NAME.
          # On manual dispatch: use the input verbatim.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RESOLVED="${{ inputs.version }}"
            echo "Manual trigger — using input version: $RESOLVED"
          else
            RESOLVED="${GITHUB_REF_NAME#v}"
            echo "Tag trigger — extracted version from tag: $RESOLVED"
          fi
          echo "VERSION=$RESOLVED" >> $GITHUB_OUTPUT

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      # Version bumps + CHANGELOG.md updates already landed on the
      # release commit that this tag points at (via `melos run release`
      # locally). All this step does is extract the top-of-file entry
      # Melos wrote so `softprops/action-gh-release` has release-body
      # content.
      #
      # Melos writes the workspace CHANGELOG.md with **date-based**
      # top-level headers (`## 2026-09-21`), not version-based ones —
      # the version appears in per-package subsections below. So the
      # extractor just takes the topmost `## …` block (that IS this
      # release, since we're running against a freshly cut tag) and
      # sanity-checks it references the target version.
      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md missing at tag; using placeholder release body."
            printf 'content<<EOF\nRelease v%s\nEOF\n' "$VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi
          awk '
            /^## / {
              if (in_block) exit
              in_block = 1
              next
            }
            in_block { print }
          ' CHANGELOG.md > CHANGES.md
          if [ ! -s CHANGES.md ] || ! grep -q "$VERSION" CHANGES.md; then
            echo "Top CHANGELOG.md block doesn't reference $VERSION; using placeholder."
            printf 'content<<EOF\nRelease v%s\nEOF\n' "$VERSION" >> $GITHUB_OUTPUT
          else
            {
              echo 'content<<EOF'
              cat CHANGES.md
              echo 'EOF'
            } >> $GITHUB_OUTPUT
          fi
          rm -f CHANGES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.content }}
          # On tag push, github.ref_name is the tag (`v0.2.0`).
          # On manual dispatch, it's the branch — synthesize the tag
          # name from the input version instead.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

      - name: Publish packages
        run: |
          # Publish in dependency order. Each package must be already on
          # pub.dev before any package that depends on it publishes,
          # because pub validates hosted deps resolve at their declared
          # constraint.
          #
          # This step is idempotent: for each package we query
          # pub.dev to see whether the current version is already
          # uploaded, and skip when it is. That means the workflow can
          # be re-run against the same tag without needing a version
          # bump — the first run publishes what's new, later runs
          # short-circuit into a green success.
          #
          # `fledge_render` and `fledge_time` are re-export shims marked
          # discontinued on pub.dev — they still exist as workspace
          # members for a deprecation window, but no new versions are
          # published, so they are absent from this list.
          PACKAGES=(
            # Foundation: no in-tree deps.
            "fledge_ecs_annotations"
            # Core: depends on annotations.
            "fledge_ecs"
            "fledge_ecs_generator"
            # Assets: depends on ecs.
            "fledge_assets"
            # Render (2D infra + components merged in v0.2).
            "fledge_render_2d"
            # Render extensions: depend on ecs + render_2d (+ assets).
            "fledge_camera_2d"
            "fledge_tween"
            "fledge_particles"
            "fledge_lighting_2d"
            # Platform / peripherals.
            "fledge_input"
            "fledge_audio"
            "fledge_window"
            # Physics (no longer depends on tiled after v0.2).
            "fledge_physics"
            # UI + calendar + yarn + save + net.
            "fledge_ui"
            "fledge_calendar"
            "fledge_yarn"
            "fledge_save"
            "fledge_net"
            # Tiled depends on physics + assets + camera_2d.
            "fledge_tiled"
            # Debug depends on ui + physics + camera_2d + render_2d.
            "fledge_debug"
          )

          VERSION=${{ steps.version.outputs.VERSION }}
          FAILED=()

          # Sequential publishes race pub.dev's CDN propagation: a
          # package can fail to publish because a just-published
          # dependency isn't visible to the resolver yet. Retry with
          # backoff to cover that case without blindly sleeping.
          publish_with_retry() {
            local pkg="$1"
            local attempt
            local delays=(0 20 40)  # attempt 1 immediate; then 20s; then 40s
            for attempt in 1 2 3; do
              local delay="${delays[$((attempt - 1))]}"
              if [ "$delay" -gt 0 ]; then
                echo "    retry $attempt after ${delay}s (propagation wait)..."
                sleep "$delay"
              fi
              if (cd "packages/$pkg" && dart pub publish --force); then
                echo "  ✓ Published $pkg $VERSION on attempt $attempt."
                return 0
              fi
            done
            echo "  ✗ Publish of $pkg failed after 3 attempts."
            return 1
          }

          for pkg in "${PACKAGES[@]}"; do
            echo ""
            echo "=== $pkg $VERSION ==="

            # Ask pub.dev whether this exact version is already
            # published. 200 = yes, skip. 404 = no (either the whole
            # package doesn't exist yet, or just this version — either
            # way, we should attempt to publish).
            HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
              "https://pub.dev/api/packages/$pkg/versions/$VERSION" || echo "000")

            case "$HTTP_STATUS" in
              200)
                echo "  ✓ $pkg $VERSION already on pub.dev, skipping."
                ;;
              404)
                echo "  → $pkg $VERSION not on pub.dev, publishing..."
                publish_with_retry "$pkg" || FAILED+=("$pkg")
                ;;
              *)
                echo "  ! Unexpected HTTP $HTTP_STATUS from pub.dev for $pkg $VERSION."
                echo "  ! Attempting publish anyway; if it succeeds, treat as first-time."
                publish_with_retry "$pkg" || FAILED+=("$pkg")
                ;;
            esac
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo ""
            echo "The following packages failed to publish:"
            printf '  - %s\n' "${FAILED[@]}"
            exit 1
          fi

          echo ""
          echo "All packages either already published or successfully published."
