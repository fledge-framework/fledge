name: fledge_docs
description: Documentation and tutorials for the Fledge game framework.
publish_to: 'none'
version: 0.1.2

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  flutter_web_plugins:
    sdk: flutter

  # Fledge ECS
  fledge_ecs: ^0.7.0

  # Fledge Input
  fledge_input: ^0.7.0

  # Fledge Render 2D (two-world architecture + 2D components).
  fledge_render_2d: ^0.7.0

  # Drifter example — embedded as an interactive demo.
  drifter_example:
    path: ../examples/drifter

  # Routing
  go_router: ^17.2.1

  # Markdown rendering
  flutter_markdown: ^0.7.0
  markdown: ^7.0.0

  # Syntax highlighting
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0

  # URL handling
  url_launcher: ^6.2.0

  # Google Fonts for clean typography
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Every package the docs show code for, so tool/check_snippets.dart can
  # analyze the snippets.
  fledge_assets: ^0.7.0
  fledge_audio: ^0.7.0
  fledge_calendar: ^0.7.0
  fledge_camera_2d: ^0.7.0
  fledge_debug: ^0.7.0
  fledge_ecs_annotations: ^0.7.0
  fledge_lighting_2d: ^0.7.0
  fledge_net: ^0.7.0
  fledge_net_steam: ^0.7.0
  fledge_particles: ^0.7.0
  fledge_physics: ^0.7.0
  fledge_save: ^0.7.0
  fledge_tiled: ^0.7.0
  fledge_tween: ^0.7.0
  fledge_ui: ^0.7.0
  fledge_window: ^0.7.0
  fledge_yarn: ^0.7.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/docs/getting-started/
    - assets/docs/ecs/
    - assets/docs/scheduling/
    - assets/docs/app/
    - assets/docs/rendering/
    - assets/docs/ui/
    - assets/docs/platform/
    - assets/docs/gameplay/
    - assets/docs/networking/
    - assets/docs/examples/
    - lib/samples/
    - lib/demos/grid_game/
