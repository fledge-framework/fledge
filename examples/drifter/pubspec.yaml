name: drifter_example
description: >
  End-to-end Fledge vertical slice — a minimal collect-em-up integrating
  ECS, render_2d, input, physics, and save.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  fledge_assets: ^0.7.2
  fledge_ecs: ^0.7.2
  fledge_render_2d: ^0.7.2
  fledge_camera_2d: ^0.7.2
  fledge_input: ^0.7.2
  fledge_physics: ^0.7.2
  fledge_save: ^0.7.2
  fledge_ui: ^0.7.2
  fledge_debug: ^0.7.2
  # Used directly by game_app.dart for `Vector2` in sprite `customSize`.
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
