name: fledge_input
description: Input handling plugin for the Fledge ECS game framework. Provides action-based input mapping with keyboard, mouse, and gamepad support.
version: 0.7.1
repository: https://github.com/fledge-framework/fledge/tree/main/packages/fledge_input
homepage: https://fledge-framework.dev
issue_tracker: https://github.com/fledge-framework/fledge/issues

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"
resolution: workspace

dependencies:
  fledge_ecs: ^0.7.1
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  gamepads: ^0.1.15
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

topics:
  - ecs
  - game-engine
  - input
  - gamepad
  - flutter-games
