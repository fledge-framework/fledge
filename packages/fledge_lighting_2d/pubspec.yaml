name: fledge_lighting_2d
description: 2D dynamic lighting for Fledge — point/directional/spot lights, ambient light, additive-blended radial gradients on top of the sprite pass.
version: 0.3.0
repository: https://github.com/fledge-framework/fledge/tree/main/packages/fledge_lighting_2d
homepage: https://fledge-framework.dev
issue_tracker: https://github.com/fledge-framework/fledge/issues

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  fledge_ecs: ^0.3.0
  fledge_assets: ^0.3.0
  fledge_render_2d: ^0.3.0
  vector_math: ^2.2.0
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

topics:
  - ecs
  - game-engine
  - lighting
  - flutter-games
