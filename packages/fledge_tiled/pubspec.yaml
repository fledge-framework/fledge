name: fledge_tiled
description: Tiled tilemap support for the Fledge ECS game framework. Load TMX/TSX maps and integrate with the Fledge render system.
version: 0.2.0
repository: https://github.com/fledge-framework/fledge/tree/main/packages/fledge_tiled
homepage: https://fledge-framework.dev
issue_tracker: https://github.com/fledge-framework/fledge/issues

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  fledge_assets: ^0.2.1
  fledge_ecs: ^0.2.1
  fledge_physics: ^0.2.1
  fledge_render: ^0.2.1
  fledge_render_2d: ^0.2.1
  fledge_camera_2d: ^0.2.1
  tiled: ^0.12.0
  vector_math: ^2.2.0
  meta: ^1.17.0
  xml: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

topics:
  - ecs
  - game-engine
  - tilemap
  - tiled
  - flutter-games
