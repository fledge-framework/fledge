name: fledge_audio
description: Audio plugin for the Fledge ECS game framework. Provides music, sound effects, and 2D spatial audio using flutter_soloud.
version: 0.2.0
repository: https://github.com/fledge-framework/fledge/tree/main/packages/fledge_audio
homepage: https://fledge-framework.dev
issue_tracker: https://github.com/fledge-framework/fledge/issues

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  fledge_assets: ^0.2.0
  fledge_ecs: ^0.2.0
  fledge_render_2d: ^0.2.0
  flutter:
    sdk: flutter
  # Widened to include 4.x/5.x. flutter_soloud 4.0 made `SoLoud.play` (and
  # friends) synchronous — see `audio_event_system.dart` / `spatial_audio_system.dart`
  # for the corresponding removed `await`s. The SDK floor above matches
  # flutter_soloud 4.0's own minimum (Dart 3.11 / Flutter 3.41).
  flutter_soloud: ">=3.4.8 <6.0.0"
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - ecs
  - game-engine
  - audio
  - sound
  - flutter-games
