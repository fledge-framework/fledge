name: fledge_audio
description: Audio plugin for the Fledge ECS game framework. Provides music, sound effects, and 2D spatial audio using flutter_soloud.
version: 0.7.1
repository: https://github.com/fledge-framework/fledge/tree/main/packages/fledge_audio
homepage: https://fledge-framework.dev
issue_tracker: https://github.com/fledge-framework/fledge/issues

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

resolution: workspace

dependencies:
  fledge_assets: ^0.7.1
  fledge_ecs: ^0.7.1
  fledge_render_2d: ^0.7.1
  flutter:
    sdk: flutter
  # flutter_soloud 5.3 builds its native library with Dart build hooks
  # (native assets). That needs Flutter 3.50 (the floor above, higher than
  # the workspace's usual 3.41): with 3.47, `flutter run` on Windows lost
  # the library and the app started without audio ("No available native
  # assets").
  flutter_soloud: ^5.3.0
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - ecs
  - game-engine
  - audio
  - sound
  - flutter-games
