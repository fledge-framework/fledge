name: fledge_audio
description: Audio plugin for the Fledge ECS game framework. Provides music, sound effects, and 2D spatial audio using flutter_soloud.
version: 0.2.0
repository: https://github.com/fledge-framework/fledge/tree/main/packages/fledge_audio
homepage: https://fledge-framework.dev
issue_tracker: https://github.com/fledge-framework/fledge/issues

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  fledge_assets: ^0.2.0
  fledge_ecs: ^0.2.0
  fledge_render_2d: ^0.2.0
  flutter:
    sdk: flutter
  # Requires flutter_soloud 4.x or 5.x. flutter_soloud 4.0 made
  # `SoLoud.play` (and friends) synchronous — see
  # `audio_event_system.dart` / `spatial_audio_system.dart` for the
  # dropped `await`s. Under the old 3.x async signature the code no
  # longer compiles, so the lower bound is >=4.0.0. The SDK floor above
  # (Dart 3.11 / Flutter 3.41) matches flutter_soloud 4.0's own minimum.
  flutter_soloud: ">=4.0.0 <6.0.0"
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - ecs
  - game-engine
  - audio
  - sound
  - flutter-games
