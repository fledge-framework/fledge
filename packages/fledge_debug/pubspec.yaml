name: fledge_debug
description: Runtime observability for Fledge — FPS/entity/schedule-ordering overlay plus AABB / collider / camera-frustum gizmos.
version: 0.3.1
repository: https://github.com/fledge-framework/fledge/tree/main/packages/fledge_debug
homepage: https://fledge-framework.dev
issue_tracker: https://github.com/fledge-framework/fledge/issues

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  fledge_ecs: ^0.3.1
  fledge_render_2d: ^0.3.1
  fledge_camera_2d: ^0.3.1
  fledge_physics: ^0.3.1
  fledge_ui: ^0.3.1
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

topics:
  - ecs
  - game-engine
  - debug
  - overlay
  - flutter-games
