name: fledge_workspace
description: Fledge - A Bevy-inspired ECS game framework for Flutter
publish_to: none

environment:
  sdk: ^3.11.0

workspace:
  - packages/fledge_ecs
  - packages/fledge_ecs_annotations
  - packages/fledge_ecs_generator
  - packages/fledge_assets
  - packages/fledge_render
  - packages/fledge_render_2d
  - packages/fledge_camera_2d
  - packages/fledge_lighting_2d
  - packages/fledge_ui
  - packages/fledge_debug

  - packages/fledge_audio
  - packages/fledge_input
  - packages/fledge_window
  - packages/fledge_tiled
  - packages/fledge_physics
  - packages/fledge_yarn
  - packages/fledge_save
  - packages/fledge_calendar
  - packages/fledge_time
  - packages/fledge_tween
  - packages/fledge_particles
  - packages/fledge_net
  - examples/basic_ecs
  - examples/advanced_ecs
  - examples/drifter
  - docs

dev_dependencies:
  melos: ^7.3.0

# Override conflicting dependencies to allow workspace resolution.
# analyzer 12.x requires meta ^1.18.0, but flutter_test pins meta to an
# older version, so we bump it here.
#
# Do NOT override test_api. flutter_test pins `test_api: 0.7.11` exactly;
# forcing a newer test_api (e.g. 0.7.14) causes the resolver to keep the
# older `test` package (1.31.1), which was built against test_api 0.7.13
# and won't compile against 0.7.14 because `Compiler.cli` was added in
# 0.7.14 and test 1.31.1's `precompiled.dart` switch is non-exhaustive.
# Leaving test_api unpinned lets pub pick a coherent set (test 1.31.0 +
# test_api 0.7.11, matching flutter_test's pin).
dependency_overrides:
  meta: ^1.18.0

melos:
  name: fledge
  repository: https://github.com/fledge-framework/fledge

  scripts:
    analyze:
      description: Run dart analyze in all packages
      run: melos exec -- dart analyze .

    test:
      description: Run all tests (dart and flutter)
      run: melos run test:dart --no-select && melos run test:flutter --no-select

    test:dart:
      description: Run tests in pure Dart packages
      run: melos exec -- dart test
      packageFilters:
        dirExists: test
        # Flutter packages need `flutter test`, not `dart test` (flutter_test
        # lives under the Flutter SDK). Every package that declares a
        # `flutter: sdk: flutter` dependency belongs here; `test:flutter`
        # picks them up via `dependsOn: flutter` below.
        # Note: `fledge_assets` is pure Dart (Phase 5) and stays out of
        # this ignore list — its tests run under `dart test`.
        ignore:
          - fledge_render
          - fledge_render_2d
          - fledge_camera_2d
          - fledge_lighting_2d
          - fledge_ui
          - fledge_debug

          - fledge_audio
          - fledge_input
          - fledge_window
          - fledge_tiled
          - fledge_save
          - fledge_tween
          - fledge_particles
          - fledge_yarn
          - fledge_physics
          - fledge_docs
          - drifter_example

    test:flutter:
      description: Run tests in Flutter packages
      run: melos exec -- flutter test
      packageFilters:
        dirExists: test
        dependsOn: flutter

    format:
      description: Format all packages
      run: melos exec -- dart format .

    build_runner:
      description: Run build_runner in packages that need it
      run: melos exec -- dart run build_runner build --delete-conflicting-outputs
      packageFilters:
        dependsOn: build_runner

    clean:
      description: Clean all packages
      run: melos exec -- dart pub cache clean

    publish:dry:
      description: |
        Preview a release by running `dart pub publish --dry-run` in each
        publishable package. Fails if any package would be rejected by
        pub.dev. Does not upload anything.
      run: melos exec -- dart pub publish --dry-run
      packageFilters:
        # Skip the workspace root (has `publish_to: none`) and the docs
        # / example workspace members that also have `publish_to: none`.
        # `melos exec` with `noPrivate: true` filters them automatically.
        noPrivate: true
